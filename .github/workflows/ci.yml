name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: JarvisCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: Packages/JarvisCore
        run: swift test --parallel

  ios-build:
    name: iOS build + tests (Simulator)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version
      - name: Voice models (GitHub release "voices-v1"; Apple voices are used when absent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download voices-v1 -R "$GITHUB_REPOSITORY" -D JarvisFit/Resources/Voices -p "jarvis_*" --clobber             && ls -la JarvisFit/Resources/Voices || echo "No voice models published yet"
      - name: Generate project
        run: xcodegen generate
      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$UDID"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project JarvisFit.xcodeproj \
            -scheme JarvisFit \
            -destination "id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || true
          grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* (BUILD|TEST)" "$RUNNER_TEMP/xcodebuild.log" | tail -80 || true
          grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/xcodebuild.log"
      - name: Compiler errors
        if: failure()
        run: grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -200 || true
      - name: Package tests on macOS
        working-directory: Packages/JarvisCore
        run: swift test
