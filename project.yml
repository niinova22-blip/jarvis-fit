name: JarvisFit

options:
  bundleIdPrefix: com.niinova
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  JarvisCore:
    path: Packages/JarvisCore
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.20.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ML3UZXMU3D

targets:
  JarvisFit:
    type: application
    platform: iOS
    sources:
      - path: JarvisFit
    dependencies:
      - package: JarvisCore
      - package: onnxruntime
        product: onnxruntime
    info:
      path: JarvisFit/Resources/Info.plist
      properties:
        CFBundleDisplayName: NOVA Coach
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: NOVA Coach uses the camera to follow your body during live workouts, to analyse meal photos and for Fit Check scans. Video is processed on this iPhone and never uploaded.
        NSMicrophoneUsageDescription: NOVA Coach uses the microphone so you can talk to NOVA hands-free during workouts. Audio is processed on this iPhone.
        NSSpeechRecognitionUsageDescription: NOVA Coach turns your voice commands into text on this iPhone so NOVA can respond.
        NSPhotoLibraryAddUsageDescription: NOVA Coach can save your Fit Check comparison images to your photo library when you ask it to.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niinova.jarvisfit
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  JarvisFitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JarvisFitTests
    dependencies:
      - target: JarvisFit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.niinova.jarvisfit.tests

schemes:
  JarvisFit:
    build:
      targets:
        JarvisFit: all
        JarvisFitTests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/JarvisFit.storekit
    test:
      config: Debug
      targets:
        - name: JarvisFitTests
    archive:
      config: Release
